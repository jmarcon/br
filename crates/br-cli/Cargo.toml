[package]
name = "br-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface for BrowserRouter (br)"

[[bin]]
name = "br"
path = "src/main.rs"

[dependencies]
br-core = { path = "../br-core" }
br-platform = { path = "../br-platform" }
br-ui-picker = { path = "../br-ui-picker" }
br-ui-settings = { path = "../br-ui-settings" }
br-daemon = { path = "../br-daemon" }
clap.workspace = true
anyhow.workspace = true
serde_json.workspace = true
serde.workspace = true
toml.workspace = true
dirs = "5"

[package.metadata.wix]
upgrade-guid = "6F3F6E1E-2E1B-4B6C-9B0E-7B6E6B5C9A11"
path-guid = "9C2C9B3D-6F0E-4F1A-9C8E-2D6F0A2C5B77"
license = false
eula = false

[package.metadata.deb]
name = "browserrouter"
maintainer = "Juliano Marcon"
copyright = "2026, Juliano Marcon"
extended-description = """\
BrowserRouter (br) routes links to the right browser/profile based on \
user-defined rules, with optional URL filters (tracking-param stripping, \
HTTPS upgrade) and a low-latency picker UI."""
section = "utils"
priority = "optional"
assets = [
    ["target/release/br", "usr/bin/br", "755"],
    ["target/release/br-daemon", "usr/bin/br-daemon", "755"],
    ["target/release/br-settings", "usr/bin/br-settings", "755"],
]

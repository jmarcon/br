[package]
name = "br-ui-settings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Settings UI for BrowserRouter (br): manage browsers, filters, and rules"

[lib]
name = "br_ui_settings"
path = "src/lib.rs"

[[bin]]
name = "br-settings"
path = "src/main.rs"

[dependencies]
br-core = { path = "../br-core" }
br-platform = { path = "../br-platform" }
anyhow.workspace = true
toml.workspace = true
dirs = "5"
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow", "x11"] }
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }

[workspace]
resolver = "2"
members = [
    "crates/br-core",
    "crates/br-platform",
    "crates/br-ui-picker",
    "crates/br-ui-settings",
    "crates/br-cli",
    "crates/br-daemon",
]

[workspace.package]
version = "0.1.4"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jmarcon/br"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
regex = "1"
url = "2"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
anyhow = "1"
